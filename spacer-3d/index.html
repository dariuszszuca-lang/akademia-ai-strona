.pw-rail{position:absolute;left:10px;top:96px;display:flex;flex-direction:column;gap:4px;max-height:calc(100% - 110px);overflow:auto}
.pw-rail button{font:inherit;font-size:12px;color:#37332d;background:rgba(251,250,247,.92);border:1px solid rgba(80,72,62,.25);border-radius:7px;padding:5px 9px;cursor:pointer;text-align:left}
.pw-rail button:hover{background:#f0ece3}.pw-rail button.on{background:#37332d;color:#fff}
.pw-rail button:disabled{opacity:.4;cursor:default}
.pw-side{position:absolute;right:10px;top:96px;width:min(310px,calc(100% - 20px));max-height:calc(100% - 120px);overflow:auto;background:rgba(255,255,255,.95);border:1px solid rgba(80,72,62,.2);border-radius:12px;padding:10px 12px;box-shadow:0 2px 12px rgba(60,50,40,.12);font-size:12px}
.pw-side h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.pw-side label{display:flex;align-items:center;gap:6px;margin:5px 0}
.pw-side select,.pw-side input[type=number],.pw-side input[type=text]{font:inherit}
.pw-side input[type=range]{flex:1}
.pw-side button,.pw-dlg2 button{font:inherit;color:inherit;background:#fbfaf7;border:1px solid rgba(80,72,62,.25);border-radius:7px;padding:3px 8px;cursor:pointer}
.pw-side .pw-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pw-side p{margin:5px 0;color:#5a5348}
.pw-side .pw-warn{background:#fff4e0;border:1px solid #f0c987;border-radius:8px;padding:6px 8px;color:#6b4a0c}
.pw-unit{display:grid;grid-template-columns:12px 1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px solid rgba(80,72,62,.12)}
.pw-unit .dot{width:12px;height:12px;border-radius:50%}
.pw-unit .meta{grid-column:2/4;color:#6a6358}
.pw-unit.edit{background:#f4efe6;border-radius:8px}
.pw-chip{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);padding:6px 12px;background:rgba(255,255,255,.95);border:1px solid rgba(80,72,62,.25);border-radius:999px;cursor:pointer;font-weight:600}
.pw-banner{position:absolute;left:50%;top:96px;transform:translateX(-50%);max-width:min(560px,80vw);padding:8px 12px;background:#37332d;color:#fff;border-radius:10px;display:flex;gap:10px;align-items:center}
.pw-banner button{font:inherit;background:#fff;color:#37332d;border:0;border-radius:6px;padding:3px 8px;cursor:pointer}
.pw-dlg2{border:1px solid rgba(80,72,62,.3);border-radius:12px;padding:14px 16px;width:min(720px,92vw);max-height:88vh;overflow:auto;color:#37332d}
.pw-dlg2::backdrop{background:rgba(40,36,30,.35)}
.pw-dlg2 h2{margin:0 0 8px;font-size:15px}
.pw-dlg2 textarea,.pw-dlg2 input[type=text]{width:100%;box-sizing:border-box;font:12px ui-monospace,Menlo,monospace}
.pw-dlg2 .pw-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.pw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.pw-grid figure{margin:0;position:relative}
.pw-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
.pw-grid figure button{position:absolute;top:4px;right:4px;padding:0 6px}
.pw-big{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:#222}
.pw-qr svg{width:180px;height:180px}
.pw-rec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,36,30,.25);color:#fff;font-size:16px;font-weight:700;pointer-events:none}
@media (max-width:640px){.pw-rail{top:auto;bottom:10px;flex-direction:row;flex-wrap:wrap;max-width:calc(100% - 20px)}.pw-side{top:auto;bottom:60px;max-height:45vh}.pw-banner{top:auto;bottom:110px}}

html,body{margin:0;height:100%;overflow:hidden;background:#dfe6ee;font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#37332d}
#pw-app{position:fixed;inset:0}
#pw-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.pw-bar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;padding:5px 8px;font-size:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid rgba(80,72,62,.15);border-radius:10px;box-shadow:0 2px 10px rgba(60,50,40,.08)}
.pw-brand{font-weight:700;letter-spacing:.2px;margin-right:4px}
.pw-name{color:#7a7266;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-seg{display:flex;border:1px solid rgba(80,72,62,.25);border-radius:7px;overflow:hidden}
.pw-bar button,.pw-bar select,.pw-card button,.pw-dlg button{font:inherit;color:inherit;background:#fbfaf7;border:1px solid rgba(80,72,62,.25);border-radius:7px;padding:3px 8px;cursor:pointer}
.pw-seg button{border:0;border-radius:0;border-right:1px solid rgba(80,72,62,.2)}
.pw-seg button:last-child{border-right:0}
.pw-bar button:hover,.pw-card button:hover,.pw-dlg button:hover{background:#f0ece3}
.pw-bar button.on{background:#37332d;color:#fff}
.pw-bar button:disabled,.pw-bar select:disabled,.pw-bar input:disabled{opacity:.4;cursor:default}
.pw-bar label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pw-spacer{flex:1}
.pw-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(440px,86vw);padding:18px 20px;text-align:center;background:rgba(255,255,255,.9);border:1px dashed rgba(80,72,62,.4);border-radius:14px}
.pw-card p{margin:0 0 10px}
.pw-card button{margin:3px}
.pw-issues{position:absolute;left:10px;bottom:10px;width:min(560px,92vw);max-height:42vh;overflow:auto;background:rgba(255,255,255,.93);border:1px solid rgba(80,72,62,.2);border-radius:10px;padding:8px 10px;box-shadow:0 2px 10px rgba(60,50,40,.1)}
.pw-issues h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.pw-issues ul{margin:0;padding:0;list-style:none}
.pw-issues li{padding:4px 0;border-top:1px solid rgba(80,72,62,.12)}
.pw-issues .e{color:#b3321f;font-weight:600}.pw-issues .w{color:#9a6a12;font-weight:600}
.pw-issues em{display:block;color:#6a6358;font-style:normal}
.pw-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 12px;background:rgba(40,36,30,.72);color:#fff;border-radius:999px;pointer-events:none}
.pw-mini{position:absolute;right:12px;bottom:12px;width:180px;height:180px;border:1px solid rgba(80,72,62,.3);border-radius:10px;background:rgba(255,255,255,.82)}
.pw-dlg{border:1px solid rgba(80,72,62,.3);border-radius:12px;padding:14px 16px;max-width:min(560px,92vw);color:#37332d}
.pw-dlg::backdrop{background:rgba(40,36,30,.35)}
.pw-dlg textarea{width:min(520px,80vw);height:260px;font:12px ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box}
.pw-dlg h2{margin:0 0 8px;font-size:15px}.pw-dlg li{margin:4px 0}
.pw-measure{position:absolute;transform:translate(-50%,-130%);padding:2px 7px;background:#d1542f;color:#fff;border-radius:6px;font-weight:600;pointer-events:none;white-space:nowrap}
.pw-overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pw-est{max-width:min(760px,94vw);max-height:88vh;overflow:auto}
.pw-est table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.pw-est th,.pw-est td{padding:4px 6px;border-bottom:1px solid rgba(80,72,62,.14);text-align:right}
.pw-est th:first-child,.pw-est td:first-child{text-align:left}
.pw-est tfoot td{font-weight:700;border-bottom:0}
.pw-est input[type=number]{width:70px;font:inherit;text-align:right}
.pw-est .pw-opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0}
.pw-est .pw-note{color:#6a6358;font-size:12px;margin:6px 0}
.pw-est .pw-total{font-size:16px;font-weight:700;margin:6px 0}
