.pw-rail{position:absolute;left:10px;top:96px;display:flex;flex-direction:column;gap:4px;max-height:calc(100% - 110px);overflow:auto}
.pw-rail button{font:inherit;font-size:12px;color:#37332d;background:rgba(251,250,247,.92);border:1px solid rgba(80,72,62,.25);border-radius:7px;padding:5px 9px;cursor:pointer;text-align:left}
.pw-rail button:hover{background:#f0ece3}.pw-rail button.on{background:#37332d;color:#fff}
.pw-rail button:disabled{opacity:.4;cursor:default}
.pw-side{position:absolute;right:10px;top:96px;width:min(310px,calc(100% - 20px));max-height:calc(100% - 120px);overflow:auto;background:rgba(255,255,255,.95);border:1px solid rgba(80,72,62,.2);border-radius:12px;padding:10px 12px;box-shadow:0 2px 12px rgba(60,50,40,.12);font-size:12px}
.pw-side h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.pw-side label{display:flex;align-items:center;gap:6px;margin:5px 0}
.pw-side select,.pw-side input[type=number],.pw-side input[type=text]{font:inherit}
.pw-side input[type=range]{flex:1}
.pw-side button,.pw-dlg2 button{font:inherit;color:inherit;background:#fbfaf7;border:1px solid rgba(80,72,62,.25);border-radius:7px;padding:3px 8px;cursor:pointer}
.pw-side .pw-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pw-side p{margin:5px 0;color:#5a5348}
.pw-side .pw-warn{background:#fff4e0;border:1px solid #f0c987;border-radius:8px;padding:6px 8px;color:#6b4a0c}
.pw-unit{display:grid;grid-template-columns:12px 1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px solid rgba(80,72,62,.12)}
.pw-unit .dot{width:12px;height:12px;border-radius:50%}
.pw-unit .meta{grid-column:2/4;color:#6a6358}
.pw-unit.edit{background:#f4efe6;border-radius:8px}
.pw-chip{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);padding:6px 12px;background:rgba(255,255,255,.95);border:1px solid rgba(80,72,62,.25);border-radius:999px;cursor:pointer;font-weight:600}
.pw-banner{position:absolute;left:50%;top:96px;transform:translateX(-50%);max-width:min(560px,80vw);padding:8px 12px;background:#37332d;color:#fff;border-radius:10px;display:flex;gap:10px;align-items:center}
.pw-banner button{font:inherit;background:#fff;color:#37332d;border:0;border-radius:6px;padding:3px 8px;cursor:pointer}
.pw-dlg2{border:1px solid rgba(80,72,62,.3);border-radius:12px;padding:14px 16px;width:min(720px,92vw);max-height:88vh;overflow:auto;color:#37332d}
.pw-dlg2::backdrop{background:rgba(40,36,30,.35)}
.pw-dlg2 h2{margin:0 0 8px;font-size:15px}
.pw-dlg2 textarea,.pw-dlg2 input[type=text]{width:100%;box-sizing:border-box;font:12px ui-monospace,Menlo,monospace}
.pw-dlg2 .pw-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.pw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.pw-grid figure{margin:0;position:relative}
.pw-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
.pw-grid figure button{position:absolute;top:4px;right:4px;padding:0 6px}
.pw-big{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:#222}
.pw-qr svg{width:180px;height:180px}
.pw-rec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,36,30,.25);color:#fff;font-size:16px;font-weight:700;pointer-events:none}

:root{--st-ink:#1d1420;--st-cream:#fffdf9;--st-paper:#ffffff;--st-accent:#c8005f;--st-accent-d:#9d004a;--st-gold:#c9a030;--st-gold-l:#f6ecd0;--st-line:rgba(29,20,32,.12);--st-muted:#6b5f68;--st-ok:#2f9e5b}
html,body{background:#efe9e2;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--st-ink)}
.pw-bar,.pw-rail,.pw-card{display:none!important}
.st-btn{font:inherit;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--st-line);background:var(--st-paper);color:var(--st-ink);cursor:pointer}
.st-btn:hover{border-color:rgba(29,20,32,.3)}
.st-btn.pri{background:var(--st-accent);border-color:var(--st-accent);color:#fff}.st-btn.pri:hover{background:var(--st-accent-d)}
.st-btn.ghost{background:transparent;border-color:transparent;color:var(--st-muted)}
.st-btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.st-btn:disabled{opacity:.45;cursor:default}
.st-top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
.st-top>*{pointer-events:auto}
.st-brand{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:rgba(255,253,249,.92);backdrop-filter:blur(10px);border:1px solid var(--st-line);border-radius:14px;min-width:0}
.st-logo{width:32px;height:32px;border-radius:9px;background:var(--st-accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.3px;flex:none}
.st-brand b{font-size:14px;white-space:nowrap}
.st-brand small{display:block;color:var(--st-muted);font-size:12px;max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-ai{font-size:11px;font-weight:700;color:#6b4a0c;background:var(--st-gold-l);border:1px solid #e6cf8c;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st-sp{flex:1}
.st-top .st-btn{background:rgba(255,253,249,.92);backdrop-filter:blur(10px)}
.st-dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:8px 10px 6px;background:var(--st-ink);border-radius:20px;box-shadow:0 10px 30px rgba(29,20,32,.28);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.st-dock::-webkit-scrollbar{display:none}
.st-grp{display:flex;flex-direction:column;align-items:center;padding:0 6px;border-left:1px solid rgba(255,255,255,.1)}
.st-grp:first-child{border-left:0}
.st-grp>small{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--st-gold);margin-bottom:4px;white-space:nowrap}
.st-grp>div{display:flex;gap:2px}
.st-tool{font:inherit;width:66px;padding:6px 2px 5px;border:0;border-radius:12px;background:transparent;color:#f4eef2;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:11px;font-weight:500;line-height:1.1}
.st-tool:hover{background:rgba(255,255,255,.08)}
.st-tool.on{background:var(--st-accent);color:#fff}
.st-tool:disabled{opacity:.35;cursor:default}
.st-ico{display:inline-grid;place-items:center}
.st-pop{position:absolute;bottom:108px;left:50%;transform:translateX(-50%);width:min(340px,calc(100% - 24px));background:var(--st-paper);border:1px solid var(--st-line);border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(29,20,32,.18);font-size:13px}
.st-pop h4{margin:0 0 8px;font-size:14px}
.st-pop .st-list{display:flex;flex-direction:column;gap:6px}
.st-pop .st-list .st-btn{justify-content:flex-start;width:100%}
.st-pop label{display:flex;align-items:center;gap:8px;margin:8px 0}
.st-pop input[type=range]{flex:1}
.st-how{background:var(--st-cream);border:1px solid var(--st-line);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:13px}
.st-how-what{margin:0 0 6px!important;color:var(--st-ink)!important;font-weight:600}
.st-how ol{margin:0;padding:0;list-style:none;counter-reset:st}
.st-how li{counter-increment:st;display:flex;gap:8px;margin:5px 0;color:var(--st-ink)}
.st-how li::before{content:counter(st);flex:none;width:20px;height:20px;border-radius:50%;background:var(--st-accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.pw-side{top:72px!important;right:12px!important;border-radius:16px!important;border-color:var(--st-line)!important;box-shadow:0 10px 30px rgba(29,20,32,.14)!important;padding:14px 16px!important;font-size:13px!important;max-height:calc(100% - 200px)!important}
.pw-side h3{font-size:16px!important}
.pw-side button,.pw-dlg2 button,.pw-dlg button{border-radius:10px!important;padding:6px 12px!important;font-weight:600}
.pw-dlg,.pw-dlg2{border-radius:18px!important;border-color:var(--st-line)!important;padding:18px 20px!important}
.pw-dlg h2,.pw-dlg2 h2{font-size:18px!important}
.pw-banner{top:72px!important;background:var(--st-ink)!important;border-radius:14px!important}
.pw-hint{bottom:112px!important;background:rgba(29,20,32,.82)!important}
.pw-chip{bottom:112px!important}
.pw-mini{bottom:112px!important}
.pw-issues{bottom:auto!important;top:72px;left:12px!important;max-height:50vh!important;border-radius:14px!important}
.st-float{position:absolute;top:72px;right:12px;width:min(300px,calc(100% - 24px));background:var(--st-paper);border:1px solid var(--st-line);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(29,20,32,.14);font-size:13px}
.st-float h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.st-wiz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(239,233,226,.72);backdrop-filter:blur(6px);overflow:auto}
.st-wiz.side{background:transparent;backdrop-filter:none;justify-content:flex-start;align-items:flex-start;pointer-events:none;padding:72px 12px 12px}
.st-card{pointer-events:auto;width:min(620px,100%);background:var(--st-paper);border:1px solid var(--st-line);border-radius:22px;padding:24px;box-shadow:0 20px 50px rgba(29,20,32,.16);max-height:100%;overflow:auto;box-sizing:border-box}
.st-wiz.side .st-card{width:min(380px,100%);max-height:calc(100vh - 200px);padding:18px}
.st-steps{display:flex;gap:6px;margin:0 0 18px}
.st-steps span{flex:1;font-size:12px;font-weight:600;color:var(--st-muted);padding-top:8px;border-top:4px solid var(--st-line)}
.st-steps span.on{color:var(--st-accent);border-color:var(--st-accent)}
.st-steps span.done{color:var(--st-ink);border-color:var(--st-ink)}
.st-card h2{margin:0 0 6px;font-size:24px;line-height:1.2;letter-spacing:-.2px}
.st-wiz.side .st-card h2{font-size:19px}
.st-card p{margin:0 0 12px;color:var(--st-muted);font-size:14px;line-height:1.5}
.st-drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px;border:2px dashed rgba(200,0,95,.35);border-radius:18px;background:#fff7fb;text-align:center;cursor:pointer;margin:8px 0 14px}
.st-drop.over{background:#ffe9f3;border-color:var(--st-accent)}
.st-drop .st-ico{color:var(--st-accent)}
.st-drop b{font-size:16px}
.st-drop small{color:var(--st-muted)}
.st-tips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.st-tips div{font-size:12.5px;color:var(--st-muted);background:var(--st-cream);border-radius:10px;padding:8px 10px;line-height:1.4}
.st-tips b{color:var(--st-ink);display:block}
.st-note{font-size:12px!important;color:var(--st-muted)!important;background:var(--st-gold-l);border-radius:10px;padding:8px 10px}
.st-or{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.st-or>span{font-size:13px;color:var(--st-muted);margin-right:2px}
.st-bar{height:10px;border-radius:99px;background:var(--st-cream);border:1px solid var(--st-line);overflow:hidden;margin:16px 0 8px}
.st-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--st-accent),#e2468c);transition:width .6s}
.st-check{list-style:none;padding:0;margin:8px 0 12px}
.st-check li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--st-line);font-size:14px}
.st-check input{width:18px;height:18px;accent-color:var(--st-accent);margin-top:1px;flex:none}
.st-thumb{width:100%;max-height:170px;object-fit:contain;border-radius:12px;border:1px solid var(--st-line);background:#fafafa;margin:0 0 10px}
.st-goals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.st-goal{font:inherit;text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;border:1px solid var(--st-line);background:var(--st-cream);cursor:pointer;color:var(--st-ink)}
.st-goal:hover{border-color:var(--st-accent);background:#fff7fb}
.st-goal .st-ico{color:var(--st-accent)}
.st-goal b{font-size:15px}.st-goal small{color:var(--st-muted);font-size:12.5px;line-height:1.35}
.st-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st-row.end{justify-content:flex-end}
.st-err{color:#a3271a!important;background:#fdecea;border-radius:10px;padding:8px 10px}
.st-tour{position:absolute;width:min(300px,calc(100% - 24px));background:var(--st-gold-l);border:1px solid #e0c57a;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(29,20,32,.2);font-size:13.5px;line-height:1.45}
.st-tour b{display:block;font-size:15px;margin-bottom:4px}
.st-tour::after{content:"";position:absolute;bottom:-8px;left:var(--st-ax,50%);width:14px;height:14px;background:var(--st-gold-l);border-right:1px solid #e0c57a;border-bottom:1px solid #e0c57a;transform:translateX(-50%) rotate(45deg)}
.st-tour .st-row{margin-top:10px}
.pw-hint{display:none!important}
.st-walkbar{position:absolute;top:64px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);box-sizing:border-box;background:rgba(255,253,249,.94);backdrop-filter:blur(10px);border:1px solid var(--st-line);border-radius:16px;padding:8px 10px;box-shadow:0 6px 20px rgba(29,20,32,.12)}
.st-walkbar>div{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.st-walkbar>div::-webkit-scrollbar{display:none}
.st-walkbar b{font-size:12px;white-space:nowrap;color:var(--st-muted)}
.st-walkbar small{display:block;font-size:11.5px;color:var(--st-muted);margin-top:6px;text-align:center}
.st-chip{font:inherit;font-size:13px;font-weight:600;white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--st-line);background:#fff;color:var(--st-ink);cursor:pointer}
.st-chip:hover{border-color:var(--st-accent)}
.st-chip.on{background:var(--st-accent);border-color:var(--st-accent);color:#fff}
.st-pad{position:absolute;left:14px;bottom:112px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.st-pad button{border:0;border-radius:16px;background:rgba(29,20,32,.78);color:#fff;cursor:pointer;display:grid;place-items:center;touch-action:none}
.st-pad button:active,.st-pad button.on{background:var(--st-accent)}
.st-pad svg{width:26px;height:26px}
.st-grp.lit{outline:2px solid var(--st-gold);outline-offset:2px;border-radius:12px}
textarea.st-in{width:100%;box-sizing:border-box;font:inherit;font-size:13px;border:1px solid var(--st-line);border-radius:10px;padding:8px}
@media (max-width:640px){
.st-brand small,.st-brand b,.st-top .st-lbl{display:none}
.st-brand{padding:6px}
.st-card{padding:18px;border-radius:18px}.st-card h2{font-size:20px}
.st-tips,.st-goals{grid-template-columns:1fr}
.st-wiz.side{align-items:flex-end;padding:12px 12px 110px}
.st-wiz.side .st-card{max-height:46vh}
.st-tool{width:58px}
.st-grp>small{font-size:9px}
.st-dock{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:28px}
.pw-side,.st-float{top:auto!important;bottom:112px!important;max-height:42vh!important}
.st-walkbar{top:60px}.st-walkbar small{display:none}
.st-pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px)}
}

html,body{margin:0;height:100%;overflow:hidden;background:#dfe6ee;font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#37332d}
#pw-app{position:fixed;inset:0}
#pw-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.pw-bar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;padding:5px 8px;font-size:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid rgba(80,72,62,.15);border-radius:10px;box-shadow:0 2px 10px rgba(60,50,40,.08)}
.pw-brand{font-weight:700;letter-spacing:.2px;margin-right:4px}
.pw-name{color:#7a7266;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-seg{display:flex;border:1px solid rgba(80,72,62,.25);border-radius:7px;overflow:hidden}
.pw-bar button,.pw-bar select,.pw-card button,.pw-dlg button{font:inherit;color:inherit;background:#fbfaf7;border:1px solid rgba(80,72,62,.25);border-radius:7px;padding:3px 8px;cursor:pointer}
.pw-seg button{border:0;border-radius:0;border-right:1px solid rgba(80,72,62,.2)}
.pw-seg button:last-child{border-right:0}
.pw-bar button:hover,.pw-card button:hover,.pw-dlg button:hover{background:#f0ece3}
.pw-bar button.on{background:#37332d;color:#fff}
.pw-bar button:disabled,.pw-bar select:disabled,.pw-bar input:disabled{opacity:.4;cursor:default}
.pw-bar label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pw-spacer{flex:1}
.pw-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(440px,86vw);padding:18px 20px;text-align:center;background:rgba(255,255,255,.9);border:1px dashed rgba(80,72,62,.4);border-radius:14px}
.pw-card p{margin:0 0 10px}
.pw-card button{margin:3px}
.pw-issues{position:absolute;left:10px;bottom:10px;width:min(560px,92vw);max-height:42vh;overflow:auto;background:rgba(255,255,255,.93);border:1px solid rgba(80,72,62,.2);border-radius:10px;padding:8px 10px;box-shadow:0 2px 10px rgba(60,50,40,.1)}
.pw-issues h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.pw-issues ul{margin:0;padding:0;list-style:none}
.pw-issues li{padding:4px 0;border-top:1px solid rgba(80,72,62,.12)}
.pw-issues .e{color:#b3321f;font-weight:600}.pw-issues .w{color:#9a6a12;font-weight:600}
.pw-issues em{display:block;color:#6a6358;font-style:normal}
.pw-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 12px;background:rgba(40,36,30,.72);color:#fff;border-radius:999px;pointer-events:none}
.pw-mini{position:absolute;right:12px;bottom:12px;width:180px;height:180px;border:1px solid rgba(80,72,62,.3);border-radius:10px;background:rgba(255,255,255,.82)}
.pw-dlg{border:1px solid rgba(80,72,62,.3);border-radius:12px;padding:14px 16px;max-width:min(560px,92vw);color:#37332d}
.pw-dlg::backdrop{background:rgba(40,36,30,.35)}
.pw-dlg textarea{width:min(520px,80vw);height:260px;font:12px ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box}
.pw-dlg h2{margin:0 0 8px;font-size:15px}.pw-dlg li{margin:4px 0}
.pw-measure{position:absolute;transform:translate(-50%,-130%);padding:2px 7px;background:#d1542f;color:#fff;border-radius:6px;font-weight:600;pointer-events:none;white-space:nowrap}
.pw-overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pw-est{max-width:min(760px,94vw);max-height:88vh;overflow:auto}
.pw-est table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.pw-est th,.pw-est td{padding:4px 6px;border-bottom:1px solid rgba(80,72,62,.14);text-align:right}
.pw-est th:first-child,.pw-est td:first-child{text-align:left}
.pw-est tfoot td{font-weight:700;border-bottom:0}
.pw-est input[type=number]{width:70px;font:inherit;text-align:right}
.pw-est .pw-opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0}
.pw-est .pw-note{color:#6a6358;font-size:12px;margin:6px 0}
